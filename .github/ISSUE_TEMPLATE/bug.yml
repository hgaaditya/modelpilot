name: Bug report
description: Report a reproducible Model Pilot problem.
title: "bug: "
labels: [bug, needs-triage]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, passwords, private chats, model weights, or unreviewed logs. Redact local paths and computer names.
  - type: input
    id: version
    attributes:
      label: Model Pilot version
      placeholder: "0.1.14"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows version and hardware
      placeholder: "Windows 11 24H2, NVIDIA GPU / CPU-only"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: What happened and how to reproduce it
      placeholder: "1. ...\n2. ...\nExpected: ...\nActual: ..."
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Redacted diagnostics or error text
      description: Paste only the minimal redacted error. Do not attach chat history or model files.
