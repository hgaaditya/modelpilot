# The runtime stack downloads upstream binaries at first run, but the setup EXE is compiled by
# Inno Setup in CI. This workflow checks script syntax/lint, the benchmark consent gate, platform
# boundaries, docs links and installer compilation. The release-artifact workflow builds a candidate
# for `release/<semver>` or `version/<semver>` branches; only an explicit `v<semver>` tag publishes
# that candidate as a GitHub Release.
#
# Windows runners are free on public repositories.

name: check

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  powershell:
    # Both platforms parse the same scripts. The macOS leg is not decoration: this codebase has to
    # run on Windows PowerShell 5.1 *and* pwsh 7, and the only reliable way to catch a construct
    # that one of them rejects is to hand the file to both.
    name: PowerShell parses and lints (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Parse every script with the same parser PowerShell itself uses. This is the cheap check
      # that would have caught a broken panel before it was pushed.
      # Scoped to tracked files on purpose. A developer's working copy also contains
      # open-webui-*/node_modules with hundreds of vendored .ps1 shims; a bare -Recurse lints
      # those too, which is slow and reports other people's code as this project's problems.
      - name: Parse all scripts
        run: |
          $bad = 0
          git ls-files '*.ps1' | ForEach-Object {
              $errors = $null
              [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $_), [ref]$null, [ref]$errors)
              if ($errors) {
                  $bad++
                  Write-Host "::error file=$_::$($errors.Count) parse error(s)"
                  $errors | ForEach-Object { Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)" }
              } else {
                  Write-Host "ok  $_"
              }
          }
          if ($bad) { exit 1 }

      - name: Install PSScriptAnalyzer
        run: Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck

      # Advisory for now - it reports, it does not fail the build. The rule set is deliberately not
      # the default one: this codebase intentionally uses Write-Host (it is a console tool whose
      # output IS the interface) and intentionally has functions that change state without
      # ShouldProcess, so those rules would be noise rather than signal.
      #
      # The first run established the baseline: 36 findings, none of them at Error severity. So
      # this is a real gate now - a new Error fails the build, while the existing warnings are
      # printed for whoever wants to work through them.
      - name: Lint
        run: |
          $skip = @(
              'PSAvoidUsingWriteHost',            # console tool - the output is the point
              'PSUseShouldProcessForStateChangingFunctions',
              'PSAvoidUsingInvokeExpression',
              'PSUseSingularNouns',
              'PSAvoidUsingPositionalParameters'
          )
          $files = git ls-files '*.ps1'
          $r = @($files | ForEach-Object { Invoke-ScriptAnalyzer -Path $_ -ExcludeRule $skip })
          $r | Where-Object Severity -ne 'Information' | Format-Table -AutoSize RuleName, Severity, ScriptName, Line, Message
          $errs = @($r | Where-Object Severity -eq 'Error')
          if ($errs.Count) { Write-Host "::error::$($errs.Count) PSScriptAnalyzer error(s)"; exit 1 }
          Write-Host "no analyzer errors ($(@($r).Count) findings total)"

  python:
    name: Benchmark consent gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # Asserts the gate refuses by default, records a yes, honours it silently afterwards, and
      # that the grader still fails closed if reached directly. It needs no model and no GPU.
      - name: Consent gate self-check
        run: python bench/test_consent.py

      - name: Benchmark tasks are valid JSON
        shell: powershell
        run: |
          $n = 0
          Get-Content bench/tasks.jsonl | Where-Object { $_.Trim() } | ForEach-Object {
              $n++
              try { $null = $_ | ConvertFrom-Json } catch { Write-Host "::error::tasks.jsonl line $n is not valid JSON"; exit 1 }
          }
          Write-Host "$n task(s) parse"

  platform-layer:
    name: Platform calls stay in platform.ps1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The macOS port works by putting every OS difference in platform.ps1 and nothing else.
      # That is only true for as long as it is checked: the failure this project's notes describe
      # most often is two implementations of one behaviour drifting apart, and a Windows fix that
      # never reaches macOS because it was written above the seam is exactly that failure.
      #
      # Comment lines are excluded on purpose - the rule is about where the code runs, not where
      # it is explained. diagnose.ps1 and tray.ps1 are exempt because they are Windows-specific
      # by nature (bugchecks, WHEA, minidumps; WinForms), not because they are allowed to drift.
      - name: No platform-bound calls outside the layer
        shell: bash
        run: |
          pat='nvidia-smi |Get-CimInstance|WScript\.Shell|System\.Windows\.Forms|-win-x64|windows_amd64|darwin_arm64|bin-macos|pc-windows-msvc|apple-darwin'
          fail=0
          for f in $(git ls-files '*.ps1'); do
            case "$f" in platform.ps1|tray.ps1|diagnose.ps1) continue ;; esac
            hits=$(grep -nE "$pat" "$f" | grep -vE '^[0-9]+: *#' | grep -vE '^[0-9]+: *//' || true)
            if [ -n "$hits" ]; then
              echo "$hits" | while IFS= read -r h; do
                echo "::error file=$f::platform-bound call outside platform.ps1 -> $h"
              done
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "Move it into platform.ps1 and call it from there."
            exit 1
          fi
          echo "platform layer intact"

  installer:
    name: Compile Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Inno Setup 6
        run: winget install --id JRSoftware.InnoSetup --exact --version 6.7.3 --scope user --silent --accept-package-agreements --accept-source-agreements

      - name: Compile setup EXE
        shell: pwsh
        run: |
          $iscc = @(
            (Join-Path $env:LOCALAPPDATA 'Programs\Inno Setup 6\ISCC.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6\ISCC.exe')
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { throw 'Inno Setup compiler was not installed.' }
          & $iscc installer\ModelPilot.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path installer\output\Model-Pilot-Setup.exe)) { throw 'Installer output was not created.' }

  docs:
    name: Docs and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # Every relative link in the markdown should point at something that exists. Broken links in
      # a README are the first thing a visitor hits.
      - name: Relative links resolve
        shell: bash
        run: |
          fail=0
          for f in *.md docs/img/*.md; do
            [ -e "$f" ] || continue
            # `|| true` because grep exits 1 on no matches, and a file with no links is fine.
            # The results feed a `for`, not a pipeline: a `while` on the right of a pipe runs in a
            # subshell, so anything it sets - including the failure flag - is lost on exit.
            links=$(grep -oE '\]\([^)#:]+\)' "$f" | sed -E 's/^\]\(//; s/\)$//' || true)
            for link in $links; do
              # Screenshots are referenced before they are taken; docs/img/README.md explains that.
              case "$link" in docs/img/*.png) continue ;; esac
              target="$(dirname "$f")/$link"
              [ "$(dirname "$f")" = "." ] && target="$link"
              if [ ! -e "$target" ]; then
                echo "::error file=$f::link target does not exist: $link"
                fail=1
              fi
            done
          done
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "all relative links resolve"
