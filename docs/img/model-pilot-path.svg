<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 230" role="img" aria-labelledby="title desc">
  <title id="title">The Model Pilot path from setup to local chat</title>
  <desc id="desc">Four steps: start local services, choose a model, verify a real response, and open local chat.</desc>
  <g fill="none" stroke="currentColor" stroke-width="2">
    <path d="M204 115H276M444 115H516M684 115H756" stroke-dasharray="7 8"/>
    <path d="M267 107l9 8-9 8M507 107l9 8-9 8M747 107l9 8-9 8"/>
    <rect x="24" y="49" width="180" height="132" rx="12"/>
    <rect x="264" y="49" width="180" height="132" rx="12"/>
    <rect x="504" y="49" width="180" height="132" rx="12"/>
    <rect x="744" y="49" width="192" height="132" rx="12"/>
    <circle cx="58" cy="82" r="16"/>
    <circle cx="298" cy="82" r="16"/>
    <circle cx="538" cy="82" r="16"/>
    <circle cx="778" cy="82" r="16"/>
  </g>
  <g fill="currentColor" font-family="system-ui, sans-serif">
    <text x="58" y="88" text-anchor="middle" font-size="15" font-weight="700">1</text>
    <text x="298" y="88" text-anchor="middle" font-size="15" font-weight="700">2</text>
    <text x="538" y="88" text-anchor="middle" font-size="15" font-weight="700">3</text>
    <text x="778" y="88" text-anchor="middle" font-size="15" font-weight="700">4</text>
    <text x="48" y="123" font-size="19" font-weight="700">Start</text>
    <text x="48" y="151" font-size="14">Set up local services</text>
    <text x="288" y="123" font-size="19" font-weight="700">Choose</text>
    <text x="288" y="151" font-size="14">Find or import a GGUF</text>
    <text x="528" y="123" font-size="19" font-weight="700">Verify</text>
    <text x="528" y="151" font-size="14">Get a real response</text>
    <text x="768" y="123" font-size="19" font-weight="700">Chat</text>
    <text x="768" y="151" font-size="14">Open a private local UI</text>
  </g>
</svg>
