# ============================================================
#  llama-swap config - ADD NEW MODELS HERE, NOTHING ELSE CHANGES
# ============================================================
# This is the TEMPLATE. start.ps1 copies it to config.yaml on first deploy, replacing
# {{LOCALLLM_ROOT}} with wherever this repo actually lives - so the checked-in file stays
# machine-independent and your real config.yaml (which is gitignored) never leaks local paths.
# Edit config.yaml, not this file, unless you're changing what a fresh install starts with.

healthCheckTimeout: 300   # big models take a while to load

macros:
  # -np 1        single client (this stack), so one request gets the whole context
  # --context-shift  default is DISABLED in this build: without it llama-server hard-errors
  #              once a conversation exceeds -c instead of dropping the oldest tokens.
  #              Safety net only - the client should prune first (see contextLength in
  #              continue.dev / open-webui), because shifting silently drops the system prompt.
  # -ngl is deliberately NOT set here. Pinning it at 99 forces every layer onto the GPU; for a
  # model that doesn't fit that is an impossible placement rather than a useful instruction.
  # This build defaults to 'auto', which fits as many layers as the card holds. A model that
  # wants a specific split sets -ngl or --n-cpu-moe in its own cmd (see -Action autotune, which
  # measures and writes those numbers).
  llama-server: >
    "{{LOCALLLM_ROOT}}\llama.cpp\llama-server.exe"
    --host 127.0.0.1 --port ${PORT}
    -fa on
    -np 1 --context-shift

  # PrismML's llama.cpp fork, installed by '-Action install-prism'. Use this macro instead of the
  # one above ONLY for models the stock build can't load - low-bit formats whose ggml tensor types
  # (42, 142 for Bonsai ternary) don't exist upstream, where stock b10155 stops at type 41.
  # Everything else should stay on the stock binary, which is the better-tested path.
  llama-server-prism: >
    "{{LOCALLLM_ROOT}}\llama.cpp-prism\llama-server.exe"
    --host 127.0.0.1 --port ${PORT}
    -fa on
    -np 1 --context-shift

models:
  # Empty on a fresh install - weights aren't bootstrapped, because GGUF quant sources vary by
  # provider and can't be guessed. Add one with:
  #
  #   .\start.ps1 -Action add-model -Model 'bartowski/Qwen_Qwen3-8B-GGUF:Q4_K_M'
  #
  # which downloads the weights and appends an entry here for you. To write one by hand:
  #
  #   "my-model-id":
  #     cmd: >
  #       ${llama-server}
  #       -m "{{LOCALLLM_ROOT}}\llama.cpp\models\my-model.gguf"
  #       -c 16384 -ctk q8_0 -ctv q8_0
  #     ttl: 600          # seconds idle before auto-unload
  #
  # Context costs VRAM on top of the weights, so -c is a per-card decision: run
  # '-Action autotune -Model <id>' to measure the largest one that actually fits and write it
  # back here. -ctk/-ctv at q4_0 halve the KV cache versus q8_0, at some cost to long-context
  # recall. A model that doesn't fit at all wants --n-cpu-moe (MoE) or a smaller quant.
