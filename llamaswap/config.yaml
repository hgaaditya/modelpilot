#  llama-swap config â€” ADD NEW MODELS HERE, NOTHING ELSE CHANGES
# ============================================================
healthCheckTimeout: 300   # big models take a while to load

macros:
  # -np 1        single client (this stack), so one request gets the whole context
  # --context-shift  default is DISABLED in this build: without it llama-server hard-errors
  #              once a conversation exceeds -c instead of dropping the oldest tokens.
  #              Safety net only - the client should prune first (see contextLength in
  #              continue.dev / open-webui), because shifting silently drops the system prompt.
  # -ngl is deliberately NOT set here. It used to be pinned at 99, which forces every layer onto
  # the GPU; for a model that doesn't fit that is an impossible placement rather than a useful
  # instruction. This build defaults to 'auto', which fits as many layers as the card holds.
  # A model that wants a specific split sets -ngl or --n-cpu-moe in its own cmd (see -Action
  # autotune, which measures and writes those numbers).
  llama-server: >
    "C:\LocalLLM\llama.cpp\llama-server.exe"
    --host 127.0.0.1 --port ${PORT}
    -fa on
    -np 1 --context-shift

  # PrismML's llama.cpp fork, installed by '-Action install-prism'. Use this macro instead of the
  # one above ONLY for models the stock build can't load - low-bit formats whose ggml tensor types
  # (42, 142 for Bonsai ternary) don't exist upstream, where stock b10155 stops at type 41.
  # Everything else should stay on the stock binary, which is the better-tested path.
  llama-server-prism: >
    "C:\LocalLLM\llama.cpp-prism\llama-server.exe"
    --host 127.0.0.1 --port ${PORT}
    -fa on
    -np 1 --context-shift

models:
  # Context sizes below are measured, not guessed: each model was loaded at two context sizes
  # and the VRAM delta read from nvidia-smi, giving KV cost per token and the largest -c that
  # fits. Budget is 10200 MiB - the card holds 12282, but the Windows desktop (browser, VS Code,
  # NVIDIA overlay) was observed using 970-1463 MiB, so the headroom is not the full card.
  #
  # gemma4 is cheap per token because 5 of every 6 layers use a 1024-token sliding window - only
  # 8 of its 48 layers grow KV with context. Qwen3-14B uses full attention on every layer, so it
  # costs ~7x more per token and hits the VRAM wall far sooner.

  # Q4_K_M: 7593 MiB of weights+compute, 9.5 MiB per 1k tokens. Trained for 262144, and the VRAM
  # ceiling is ~280k, so 65536 is a speed/headroom choice rather than a limit - raise if wanted.
  "gemma4-v2":
    cmd: >
      ${llama-server}
      -m "C:\LocalLLM\llama.cpp\models\gemma4-v2-Q4_K_M.gguf"
      -c 65536 -ctk q8_0 -ctv q8_0
    ttl: 600

  # Q6_K needs 9889 MiB before a single token of context, leaving ~300 MiB of the budget - which
  # is what killed the llama-server spawns in llama-swap.err.log. -c 16384 is the safe ceiling
  # here. Re-pull this one at Q4_K_M like gemma4-v2 and it gets the same enormous context.
  "gemma4-coding-Q6_K":
    cmd: >
      ${llama-server}
      -m "C:\LocalLLM\llama.cpp\models\gemma4-coding-Q6_K.gguf"
      -c 16384 -ctk q8_0 -ctv q8_0
    ttl: 600

  # Superseded by "gemma4-v2" above (same model, Q4_K_M). Kept only so an existing chat pointing
  # at this id still resolves; delete this entry and the 9.1 GB .gguf once nothing references it.
  "gemma4-v2-Q6_K":
    cmd: >
      ${llama-server}
      -m "C:\LocalLLM\llama.cpp\models\gemma4-v2-Q6_K.gguf"
      -c 16384 -ctk q8_0 -ctv q8_0
    ttl: 600

  # 8551 MiB base, and the expensive one for context because every layer uses full attention:
  # 68 MiB per 1k tokens at q8_0 KV. A benchmark run at 20480/q8_0 peaked at 10959 MiB of the
  # card's 12282, leaving ~1.3 GB - and the desktop compositor visibly glitched, because that is
  # roughly what the desktop itself needs. q4_0 KV halves the cache instead of cutting context,
  # so the 20480 stays and about 700 MiB comes back. The cost is real but narrow: q4_0 degrades
  # recall of tokens early in a long conversation, not general quality.
  "qwen3-14b":
    cmd: >
      ${llama-server}
      -m "C:\LocalLLM\llama.cpp\models\Qwen3-14B-Q4_K_M.gguf"
      -c 20480 -ctk q4_0 -ctv q4_0
    ttl: 600          # unload after 10 min idle

  "qwen3-8b-longctx":
    cmd: >
      ${llama-server}
      -m "C:\LocalLLM\llama.cpp\models\Qwen3-8B-Q4_K_M.gguf"
      -c 65536 -ctk q4_0 -ctv q4_0
    ttl: 600

  "scout-moe":
    cmd: >
      ${llama-server}
      -m "C:\LocalLLM\llama.cpp\models\Llama-4-Scout-Q4.gguf"
      -c 16384 -ctk q8_0 -ctv q8_0
      --n-cpu-moe 40
    ttl: 300

  # Ternary Bonsai 27B: 27B-class weights at ~1.71 bits, so ~7.15 GB resident where a normal
  # Q4 27B would need ~17.6 GB. Requires the PrismML fork (ggml tensor type 42; stock llama.cpp
  # stops at 41), hence the llama-server-prism macro.
  # q4_0 KV is not a compromise here the way it is for qwen3-14b: the vendor ships 4-bit KV as
  # the intended operating point, and the hybrid backbone grows a full-attention cache on only
  # 16 of its 64 layers. That makes context unusually cheap - 32768 measured 9091 MiB with
  # 2920 MiB still free, so 65536 fits comfortably. Sized for agentic clients (Claude Code sends
  # 15-25k tokens of system prompt and tool definitions before your first message).
  "bonsai-27b":
    cmd: >
      ${llama-server-prism}
      -m "C:\LocalLLM\llama.cpp\models\Ternary-Bonsai-27B-Q2_0.gguf"
      -c 65536 -ctk q4_0 -ctv q4_0
    ttl: 600

  "qwen2.5-0.5b-instruct-q4_k_m":
    cmd: >
      ${llama-server}
      -m "C:\LocalLLM\llama.cpp\models\qwen2.5-0.5b-instruct-q4_k_m.gguf"
      -c 16384 -ctk q8_0 -ctv q8_0
    ttl: 600